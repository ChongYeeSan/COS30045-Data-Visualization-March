<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG House with Garden</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8f2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .canvas {
      border: 2px solid #667788;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #dbe8ff 100%);
      padding: 16px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
    }
    h1 {
      text-align: center;
      color: #34495e;
      margin-bottom: 12px;
    }
    svg {
      display: block;
      max-width: 720px;
      width: 100%;
      height: auto;
    }
    .label {
      fill: #2a3f54;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <h1>A House with Garden</h1>
    <svg viewBox="0 0 720 650" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
      <title>House with garden illustrated using SVG shapes, paths, text, grouping, transformations, and styles.</title>
      <desc>A simple house with a garden, showing SVG rectangles, circles, ellipses, lines, paths, grouped elements, transformations, and styled text.</desc>

      <!-- background sky and ground -->
      <rect x="0" y="0" width="720" height="400" fill="#a5d8ff" />  
      <rect x="0" y="380" width="720" height="270" fill="#7dbb53" /> 

      <!-- sun using circle and transform -->
      <g transform="translate(560 80)">
        <circle cx="0" cy="0" r="44" fill="#ffde59" stroke="#f5c518" stroke-width="6" /> // sun body
        <g stroke="#ffde59" stroke-width="6" transform="rotate(22)">
          <line x1="-70" y1="0" x2="-104" y2="0" /> 
          <line x1="70" y1="0" x2="104" y2="0" />
          <line x1="0" y1="-70" x2="0" y2="-104" />
          <line x1="-50" y1="-50" x2="-80" y2="-80" />
          <line x1="50" y1="-50" x2="80" y2="-80" />
          <line x1="-50" y1="50" x2="-80" y2="80" />
          <line x1="50" y1="50" x2="80" y2="80" />
        </g>
      </g>

      <!-- house group -->
      
      <g id="house" transform="translate(180 200)">
        <rect x="0" y="80" width="260" height="170" rx="20" ry="20" fill="#f4b47f" stroke="#bc7b5a" stroke-width="6" /> 
        <polygon points="0,80 130,0 260,80" fill="#a1502b" stroke="#7b381b" stroke-width="6" /> 
        <rect x="28" y="130" width="70" height="120" rx="10" ry="10" fill="#5b8fcd" stroke="#395a80" stroke-width="5" /> 
        <rect x="157" y="125" width="66" height="60" fill="#fff7d6" stroke="#d9c281" stroke-width="5" 
        <path d="M163 275 l0 25 c0 14 11 25 25 25 s25 -11 25 -25 l0 -25" fill="#5a7f4f" stroke="#3f5735" stroke-width="5" /> 
        <circle cx="40" cy="190" r="8" fill="#ffe19e" stroke="#c9972f" stroke-width="3" />
        <line x1="0" y1="255" x2="260" y2="255" stroke="#7b381b" stroke-width="6" />
      </g>

      <!-- garden area with paths and flowers -->    

        <g transform="translate(80 460)">
          <ellipse cx="0" cy="0" rx="62" ry="22" fill="#8A5E3B" />
          <ellipse cx="0" cy="0" rx="20" ry="18" fill="#694B33" opacity="0.7" />
        </g>
        <g transform="translate(530 425)">
          <ellipse cx="0" cy="0" rx="55" ry="20" fill="#8A5E3B"/>
          <ellipse cx="-20" cy="-9" rx="19" ry="13" fill="#694B33" opacity="0.7" />         
        </g>
        <g transform="translate(620 425)">
          <ellipse cx="0" cy="0" rx="54" ry="20" fill="#8A5E3B"/>
          <ellipse cx="-20" cy="-9" rx="16" ry="12" fill="#694B33" opacity="0.7"/>         
        </g>
        <g transform="translate(623 460)">
          <ellipse cx="0" cy="0" rx="54" ry="25" fill="#8A5E3B"/>
          <ellipse cx="2" cy="-3" rx="16" ry="12" fill="#694B33" opacity="0.7" />         
        </g>
        <g transform="translate(543 460)">
          <ellipse cx="0" cy="0" rx="54" ry="30" fill="#8A5E3B"/>
          <ellipse cx="-13" cy="4" rx="16" ry="12" fill="#694B33" opacity="0.7" />         
        </g>
        <g transform="translate(623 510)">
          <ellipse cx="0" cy="0" rx="54" ry="40" fill="#8A5E3B"/>
          <ellipse cx="-13" cy="4" rx="16" ry="12" fill="#694B33" opacity="0.7" />         
        </g>
        <g transform="translate(543 510)">
          <ellipse cx="0" cy="0" rx="54" ry="40" fill="#8A5E3B"/>
          <ellipse cx="-13" cy="4" rx="16" ry="12" fill="#694B33" opacity="0.7" />         
        </g>

        <!-- Flower 1 - Red -->
        <g id="flower1" transform="translate(620 490)">
          <circle cx="0" cy="0" r="10" fill="#ff6b6b" />
          <circle cx="-18" cy="-2" r="9" fill="#ff9daa" />
          <circle cx="18" cy="-2" r="9" fill="#ff9daa" />
          <circle cx="-2" cy="-18" r="9" fill="#ff9daa" />
          <circle cx="-2" cy="18" r="9" fill="#ff9daa" /> 
          <path d="M0 10 L0 35" stroke="#4c6b3a" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Flower 2 - Yellow -->
        <g id="flower2" transform="translate(610 380) scale(1.1)">
          <circle cx="0" cy="0" r="10" fill="#fadc6f" /> 
          <circle cx="-16" cy="-6" r="8" fill="#ffe9a1" />
          <circle cx="16" cy="-6" r="8" fill="#ffe9a1" /> 
          <circle cx="0" cy="-18" r="8" fill="#ffe9a1" />
          <circle cx="0" cy="16" r="8" fill="#ffe9a1" />
          <path d="M0 10 L0 36" stroke="#5e7a3d" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Flower 3 - Purple -->
        <g id="flower3" transform="translate(630 429)">
          <path d="M0 -12 c10 4 10 18 0 22 c-10 4 -10 -18 0 -22" fill="#df5771" />
          <circle cx="0" cy="0" r="9" fill="#7351F5" />
          <circle cx="-16" cy="-6" r="8" fill="#9C86F0" />
          <circle cx="16" cy="-6" r="8" fill="#9C86F0" />
          <circle cx="0" cy="16" r="8" fill="#9C86F0" />
          <circle cx="0" cy="-18" r="8" fill="#9C86F0" />
          <path d="M0 10 L0 36" stroke="#4d6f3b" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Flower 4 - Blue -->
        <g id="flower4" transform="translate(530 429)">
          <path d="M0 -12 c10 4 10 18 0 22 c-10 4 -10 -18 0 -22" fill="#df5771" />
          <circle cx="0" cy="0" r="9" fill="#2063c6" />
          <circle cx="-16" cy="-6" r="8" fill="#7db6ff" />
          <circle cx="16" cy="-6" r="8" fill="#7db6ff" />
          <circle cx="0" cy="16" r="8" fill="#7db6ff" />
          <circle cx="0" cy="-18" r="8" fill="#7db6ff" />
          <path d="M0 10 L0 36" stroke="#4d6f3b" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Flower 5 - Green -->
        <g id="flower5" transform="translate(510 380) scale(1.1)">
          <circle cx="0" cy="0" r="10" fill="#3fb81f" /> 
          <circle cx="-16" cy="-6" r="8" fill="#86e36d" />
          <circle cx="16" cy="-6" r="8" fill="#86e36d" /> 
          <circle cx="0" cy="-18" r="8" fill="#86e36d" />
          <circle cx="0" cy="16" r="8" fill="#86e36d" />
          <path d="M0 10 L0 36" stroke="#5e7a3d" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Flower 6 - Orange -->
        <g id="flower6" transform="translate(530 490)">
          <circle cx="0" cy="0" r="10" fill="#ff711f" />
          <circle cx="-18" cy="-2" r="9" fill="#ff8e4a" />
          <circle cx="18" cy="-2" r="9" fill="#ff8e4a" />
          <circle cx="-2" cy="-18" r="9" fill="#ff8e4a" />
          <circle cx="-2" cy="18" r="9" fill="#ff8e4a" /> 
          <path d="M0 10 L0 35" stroke="#4c6b3a" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- Flower 7 - Indigo -->
        <g id="flower7" transform="translate(80 430)">
          <circle cx="0" cy="0" r="10" fill="#A836a0" />
          <circle cx="-18" cy="-2" r="9" fill="#ff5ef5" />
          <circle cx="18" cy="-2" r="9" fill="#ff5ef5" />
          <circle cx="-2" cy="-18" r="9" fill="#ff5ef5" />
          <circle cx="-2" cy="18" r="9" fill="#ff5ef5" /> 
          <path d="M0 10 L0 35" stroke="#4c6b3a" stroke-width="4" stroke-linecap="round" />
        </g>
        
      
      <!-- trees using groups and transforms -->
      <g id="trees" transform="translate(560 255) scale(0.88)">
        <rect x="-22" y="18" width="44" height="140" fill="#844f25" />
        <ellipse cx="50" cy="-10" rx="58" ry="62" fill="#3c8d42" />
        <ellipse cx="-5" cy="-45" rx="58" ry="62" fill="#3c8d42" />
        <ellipse cx="-40" cy="-5" rx="58" ry="62" fill="#3c8d42" />
        <ellipse cx="0" cy="0" rx="58" ry="62" fill="#3c8d42" />         
      </g>

      <g id="tree2" transform="translate(90 250) scale(0.9)">
        <rect x="-18" y="10" width="36" height="150" fill="#6f3e22" />
        <ellipse cx="-5" cy="-45" rx="58" ry="62" fill="#3c8d42" />
        <ellipse cx="-40" cy="-5" rx="58" ry="62" fill="#3c8d42" />
        <ellipse cx="29" cy="-8" rx="58" ry="62" fill="#3c8d42" />      
      </g>

      <!-- path leading to house using path element -->
      <path d="M180 460 C 390 450, 50 550, 20 600, S 500 620, 555 ,720 650" fill="none" stroke="#fad298" stroke-width="6" />

      <path d="M265 450 C 650 550, 50 550, 200 600 , S 500 620 ,690 800" fill="none" stroke="#fad298" stroke-width="6" /> 

      <!-- text labels -->
      <text x="48" y="50" class="label">A house with a garden</text>
      <!-- <text x="500" y="500" fill="#34495e" font-size="14" font-style="italic">Shapes, paths, groups, transforms, and styling</text> -->

      <!-- decorative line element -->
      <!-- <line x1="40" y1="500" x2="680" y2="500" stroke="#4a6271" stroke-width="3" stroke-dasharray="8 6" /> -->
    </svg>
  </div>
</body>
</html>
